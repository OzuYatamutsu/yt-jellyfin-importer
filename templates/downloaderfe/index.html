<!DOCTYPE html>
<html>
<head>
    <title>YouTube -> Jellyfin downloader</title>

    <style>
        body {
            max-width: 700px;
            margin: auto;
            padding-top: 60px;
            font-family: sans-serif;
        }

        input {
            width:100%;
            font-size:18px;
            padding:12px;
        }

        button {
            margin-top:20px;
            padding:12px 24px;
            font-size:18px;
        }

        #progressContainer{
            display:none;
            margin-top:40px;
        }

        progress{
            width:100%;
            height:30px;
        }

        #finished{
            display:none;
            margin-top:30px;
        }
    </style>
</head>

<body>

<h1>YouTube -> Jellyfin downloader!! >:3</h1>

<input
    id="url"
    placeholder="Paste YouTube URL"
/>

<button onclick="startDownload()">
Download
</button>

<div id="progressContainer">

<h3 id="status">
Waiting...
</h3>

<progress
    id="progress"
    value="0"
    max="100">
</progress>

</div>

<div id="finished">

<h2>Finished!</h2>

<p id="song"></p>

<a id="download" href="">
Download MP3
</a>

</div>

<script>

async function startDownload() {
    const url = document.getElementById("url").value
    const response = await fetch("/start/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            link: url
        })
    });

    const job = await response.json()
    document.getElementById("progressContainer").style.display = "block"
    poll(job.id)
}

async function poll(id) {
    const response = await fetch(`/status/${id}`)
    const status = await response.json()

    document.getElementById("status").innerText = status.log_line
    document.getElementById("progress").value = status.percent

    if (status.finished) {
        document.getElementById("finished").style.display = "block"
        document.getElementById("song").innerText = `${status.artist} - ${status.title}`
        return
    }

    setTimeout(() => {
        poll(id)
    }, 1000)
}

</script>

</body>
</html>
